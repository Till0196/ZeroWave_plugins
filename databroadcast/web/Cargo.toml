[package]
name = "web"
description = "MMT のデータ放送（ARIB-HTML5）を Blitz と boa で動かす"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
blitz-dom = { git = "https://github.com/Till0196/blitz", rev = "ec66a911226e9242f63236c7580167fa741a6875", default-features = false, features = ["svg", "autofocus", "custom-widget", "floats", "woff"] }
blitz-html = { git = "https://github.com/Till0196/blitz", rev = "ec66a911226e9242f63236c7580167fa741a6875", default-features = false }
blitz-paint = { git = "https://github.com/Till0196/blitz", rev = "ec66a911226e9242f63236c7580167fa741a6875", default-features = false, features = ["svg", "custom-widget"] }
blitz-traits = { git = "https://github.com/Till0196/blitz", rev = "ec66a911226e9242f63236c7580167fa741a6875", default-features = false }
blitz-vibey-script = { git = "https://github.com/Till0196/blitz", rev = "ec66a911226e9242f63236c7580167fa741a6875", default-features = false }
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
peniko = "0.6"
kurbo = "0.13"
url = "2"
png = "0.18"
gif = "0.14"
zune-jpeg = "0.4"
zune-core = "0.4"
boa_engine = { version = "0.22", features = ["annex-b"] }
miniz_oxide = "0.8"
isdb = { workspace = true }
bml = { path = "../bml" }
bytes = "1"
data-url = "0.3"
parlance = "0.1"
keyboard-types = "0.8"
parley = { version = "0.12", default-features = false, features = ["std", "bytemuck"] }
bytemuck = "1"
zwsdk.workspace = true
http = "1"

[dev-dependencies]
zwsdk = { workspace = true, features = ["host"] }
